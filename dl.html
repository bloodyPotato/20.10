<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Mừng 20/10 - Gửi Em Yêu</title>
    <style>
        /* CSS Dùng để tạo hình trái tim và hiệu ứng ảo lòi */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f7d2d2; /* Màu nền nhẹ nhàng */
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            flex-direction: column;
        }

        .heart-container {
            position: relative;
            width: 200px;
            height: 200px;
            /* Tạo hiệu ứng tim đập */
            animation: beat 1.2s infinite ease-in-out;
        }

        .heart {
            position: absolute;
            height: 100%;
            width: 100%;
            background-color: #e91e63; /* Màu hồng đậm cho trái tim */
            transform: rotate(-45deg); /* Xoay 45 độ để tạo hình kim cương */
        }

        /* Tạo hai nửa hình tròn để hoàn thiện trái tim */
        .heart::before,
        .heart::after {
            content: "";
            background-color: #e91e63; /* Cùng màu với trái tim */
            border-radius: 50%;
            position: absolute;
            height: 100%;
            width: 100%;
        }

        .heart::before {
            top: -50%;
            left: 0;
        }

        .heart::after {
            left: 50%;
            top: 0;
        }
        
        /* Hiệu ứng nhịp đập */
        @keyframes beat {
            0% { transform: scale(0.95); }
            20% { transform: scale(1.1); }
            40% { transform: scale(1); }
            60% { transform: scale(1.1); }
            80% { transform: scale(1.05); }
            100% { transform: scale(0.95); }
        }

        /* Chữ nằm trong trái tim */
        .message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10; /* Đảm bảo chữ nằm trên trái tim */
            text-align: center;
            color: white; /* Màu chữ */
            font-size: 16px;
            font-weight: bold;
            line-height: 1.4;
            /* Tạo chữ ảo lòi (bóng mờ) */
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.7);
        }

        .footer {
            margin-top: 30px;
            font-size: 1.2em;
            color: #d84343;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
        }

    </style>
</head>
<body>

    <div class="heart-container">
        <div class="heart"></div>
        <div class="message">
            <p>20/10<br>Gửi người anh yêu<br>Mãi mãi bên anh!</p>
        </div>
    </div>
    
    <div class="footer">
        Chúc em yêu ngày Phụ nữ Việt Nam hạnh phúc!
    </div>

</body>
</html>
