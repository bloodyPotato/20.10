<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>20/10 - Tặng Em Món Quà Nhỏ Từ Anh</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #1a1a3d, #3a3f69, #4a1a33);
            overflow: hidden;
            font-family: 'Roboto', sans-serif;
            color: #ffffff;
            flex-direction: column;
            position: relative;
        }
        .sparkle {
            position: absolute;
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
            animation: sparkle-fade 2s forwards infinite;
        }
        @keyframes sparkle-fade {
            0% { transform: scale(0) translateY(0); opacity: 0; }
            50% { transform: scale(1) translateY(-20px); opacity: 1; }
            100% { transform: scale(0.5) translateY(-50px); opacity: 0; }
        }
        .heart-container {
            position: relative;
            width: 300px;
            height: 300px;
            margin-top: -20px;
            animation: beat-3d 1.8s infinite ease-in-out, glow-pulse 3s infinite alternate;
            box-shadow: 0 0 60px rgba(255, 50, 150, 0.8), 0 0 100px rgba(255, 50, 150, 0.4);
            border-radius: 50%;
            z-index: 10;
            display: none;
        }
        .heart {
            position: absolute;
            height: 100%;
            width: 100%;
            background: linear-gradient(45deg, #ff4d94, #ff1a66);
            transform: rotate(-45deg);
        }
        .heart::before,
        .heart::after {
            content: "";
            background: linear-gradient(45deg, #ff4d94, #ff1a66);
            border-radius: 50%;
            position: absolute;
            height: 100%;
            width: 100%;
            box-shadow: 0 0 30px rgba(255, 50, 150, 0.8);
        }
        .heart::before { top: -50%; left: 0; }
        .heart::after { left: 50%; top: 0; }
        @keyframes beat-3d {
            0% { transform: scale(0.95); opacity: 1; }
            25% { transform: scale(1.1) rotate(3deg); opacity: 0.9; }
            50% { transform: scale(0.98); opacity: 1; }
            75% { transform: scale(1.08) rotate(-3deg); opacity: 0.95; }
            100% { transform: scale(0.95); opacity: 1; }
        }
        @keyframes glow-pulse {
            from { box-shadow: 0 0 60px rgba(255, 50, 150, 0.8), 0 0 100px rgba(255, 50, 150, 0.4); }
            to { box-shadow: 0 0 80px rgba(255, 100, 180, 1), 0 0 120px rgba(255, 100, 180, 0.6); }
        }
        .message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -60%);
            z-index: 11;
            text-align: center;
            color: #fff0f5;
            font-size: 32px;
            font-family: 'Dancing Script', cursive;
            line-height: 1.5;
            padding: 10px 0;
            text-shadow: 0 0 10px #ff99cc, 0 0 20px #ff99cc;
            animation: text-glow 2.5s infinite alternate ease-in-out;
        }
        @keyframes text-glow {
            0% { text-shadow: 0 0 10px #fff, 0 0 20px #ff99cc; }
            100% { text-shadow: 0 0 15px #fff, 0 0 25px #ff66b3; }
        }
        .footer {
            margin-top: 60px;
            font-family: 'Dancing Script', cursive;
            font-size: 2.3em;
            color: #ffccdd;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.3);
            animation: wave 5s infinite alternate ease-in-out;
            display: none;
        }
        @keyframes wave {
            0% { transform: translateX(-5px); }
            100% { transform: translateX(5px); }
        }
        .start-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: absolute;
            width: 100%;
            height: 100vh;
            background: linear-gradient(135deg, #1a1a3d, #3a3f69);
            z-index: 20;
            transition: opacity 1s ease;
        }
        .start-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .start-text {
            font-size: 2.2em;
            font-family: 'Dancing Script', cursive;
            color: #ffccdd;
            margin-bottom: 20px;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.3);
        }
        .start-button {
            padding: 15px 30px;
            font-size: 1.6em;
            font-family: 'Dancing Script', cursive;
            color: #fff;
            background: linear-gradient(45deg, #ff4d94, #ff1a66);
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 50, 150, 0.8);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .start-button:hover {
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(255, 50, 150, 1);
        }
        .question-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: absolute;
            width: 100%;
            height: 100vh;
            background: linear-gradient(135deg, #1a1a3d, #3a3f69);
            z-index: 20;
            transition: opacity 1s ease;
        }
        .question-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .question-text {
            font-size: 2em;
            font-family: 'Dancing Script', cursive;
            color: #ffccdd;
            margin-bottom: 30px;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 80%;
        }
        .button-container {
            display: flex;
            gap: 20px;
        }
        .yes-button, .no-button {
            padding: 12px 25px;
            font-size: 1.4em;
            font-family: 'Dancing Script', cursive;
            color: #fff;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .yes-button {
            background: linear-gradient(45deg, #ff4d94, #ff1a66);
            box-shadow: 0 0 20px rgba(255, 50, 150, 0.8);
        }
        .yes-button:hover {
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(255, 50, 150, 1);
        }
        .no-button {
            background: linear-gradient(45deg, #6666ff, #3333cc);
            box-shadow: 0 0 20px rgba(50, 50, 255, 0.8);
            position: relative;
        }
        .no-button:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <div class="start-screen" id="startScreen">
        <div class="start-text">Quà 20/10 đặc biệt của mợ được ship tới rồi đây! 😘</div>
        <button class="start-button" onclick="showQuestion()">Mở quà của ck</button>
    </div>
    <div class="question-screen" id="questionScreen">
        <div class="question-text">Câu hỏi xác minh: Em có phải là em iu ngoan ngoãn luôn nghe lời ck không? 😜</div>
        <div class="button-container">
            <button class="yes-button" onclick="openCard()">Có</button>
            <button class="no-button" id="noButton" onclick="moveNoButton()">Không</button>
        </div>
    </div>
    <div id="sparkle-container"></div>
    <div class="heart-container" id="heartContainer">
        <div class="heart"></div>
        <div class="message">
            <p>Bây giờ và sau này<br>sẽ luôn dành những điều<br>tốt đẹp nhất cho em</p>
        </div>
    </div>
    <div class="footer" id="footerMessage">
        Chúc em 20/10 vui vẻ, luôn hạnh phúc bên anh nhé!
    </div>
    <script>
        const sparkleContainer = document.getElementById('sparkle-container');
        const numSparkles = 50;
        for (let i = 0; i < numSparkles; i++) {
            const sparkle = document.createElement('div');
            sparkle.classList.add('sparkle');
            sparkle.style.width = sparkle.style.height = `${Math.random() * 5 + 2}px`;
            sparkle.style.left = `${Math.random() * 100}%`;
            sparkle.style.top = `${Math.random() * 100}%`;
            sparkle.style.animationDelay = `${Math.random() * -3}s`;
            sparkleContainer.appendChild(sparkle);
        }
        function showQuestion() {
            const startScreen = document.getElementById('startScreen');
            const questionScreen = document.getElementById('questionScreen');
            startScreen.classList.add('hidden');
            questionScreen.style.display = 'flex';
            setTimeout(() => {
                startScreen.style.display = 'none';
            }, 1000);
        }
        function openCard() {
            const questionScreen = document.getElementById('questionScreen');
            const heartContainer = document.getElementById('heartContainer');
            const footerMessage = document.getElementById('footerMessage');
            questionScreen.classList.add('hidden');
            heartContainer.style.display = 'block';
            footerMessage.style.display = 'block';
            setTimeout(() => {
                questionScreen.style.display = 'none';
            }, 1000);
        }
        function moveNoButton() {
            const noButton = document.getElementById('noButton');
            const maxX = window.innerWidth - 150;
            const maxY = window.innerHeight - 50;
            const newLeft = Math.random() * maxX;
            const newTop = Math.random() * maxY;
            noButton.style.position = 'absolute';
            noButton.style.left = `${newLeft}px`;
            noButton.style.top = `${newTop}px`;
        }
    </script>
</body>
</html>
